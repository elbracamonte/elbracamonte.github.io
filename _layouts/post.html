---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <p class="post-date">
    {{ page.date | date: "%d de %B de %Y" }}
  </p>

  {% if page.image %}
    <figure class="post-featured-image">
      <img 
        src="{{ page.image }}" 
        alt="{{ page.image_alt | default: page.title }}">
    </figure>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>
</article>
