---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <p class="post-date">
    {{ page.date | date: "%d de %B de %Y" }}
  </p>

  {% if page.image %}
    <figure class="post-featured-image">
      <img 
        src="{{ page.image }}" 
        alt="{{ page.image_alt | default: page.title }}">
    </figure>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>
</article>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ page.title }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Organization",
    "name": "El México Bárbaro"
  },
  "publisher": {
    "@type": "Organization",
    "name": "El México Bárbaro",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.url }}/assets/img/logo.png"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  }
}
</script>
