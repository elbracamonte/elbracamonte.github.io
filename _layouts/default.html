<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.site_name }}
    {% else %}
      {{ site.site_name }}
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.site_description }}">
  <meta name="language" content="{{ site.site_language }}">
  <meta property="og:site_name" content="{{ site.site_name }}">
  <meta property="og:title" content="{{ page.title | default: site.site_name }}">
  <meta property="og:description" content="{{ page.description | default: site.site_description }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ site.site_url }}{{ page.url }}">
  {% if page.image %}
  <meta property="og:image" content="{{ site.site_url }}{{ page.image }}">
  {% endif %}

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="canonical" href="{{ site.site_url }}{{ page.url }}">
  
  {% if page.layout == "post" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "inLanguage": "es-MX",
    "headline": "{{ page.title }}",
    "description": "{{ page.description }}",
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
    {% if page.image %}
    "image": {
      "@type": "ImageObject",
      "url": "{{ page.image | absolute_url }}"
    },
    {% endif %}
    "author": {
      "@type": "Organization",
      "name": "{{ site.site_name }}",
      "url": "{{ site.site_url }}"
    },
    "publisher": {
      "@type": "Organization",
      "name": "{{ site.site_name }}"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ page.url | absolute_url }}"
    }
  }
  </script>
  {% endif %}
</head>

<body>
  <header>
    <nav class="top-nav">
      <a class="brand" href="/">El México Bárbaro</a>
  
      <ul class="menu">
        <li><a href="/">Inicio</a></li>
        <li><a href="/tradiciones/">Tradiciones</a></li>
        <li><a href="/gastronomia/">Gastronomía</a></li>
        <li><a href="/historia/">Historia</a></li>
        <li><a href="/sobre/">Sobre</a></li>
      </ul>
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer>
    <p>© {{ site.time | date: "%Y" }} El México Bárbaro — Archivo vivo de la cultura mexicana.</p>
  </footer>
</body>
</html>
