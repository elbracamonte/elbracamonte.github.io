---
layout: default
title: Tradiciones
---

<h1>Tradiciones</h1>

<p>
Las tradiciones mexicanas son la expresión viva de una identidad construida a través de siglos.
</p>

<section class="post-list">
  {% for post in site.categories.tradiciones %}
    <article class="post-item">
      <h2>
        <a href="{{ post.url }}">{{ post.title }}</a>
      </h2>
      <p class="post-meta">
        {{ post.date | date: "%d de %B de %Y" }}
      </p>
      <p>{{ post.excerpt }}</p>
    </article>
  {% endfor %}
</section>
