title: "El México Bárbaro"
description: "Archivo vivo de la cultura mexicana: tradiciones, gastronomía e historia."
url: "https://www.elmexicobarbaro.com"
baseurl: "" # porque es un User Site, no subcarpeta
lang: "es-MX"

theme: minima

# Plugins disponibles en GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Enlaces de navegación (luego los ajustaremos)
header_pages:
  - index.md

# Configuración de Markdown
markdown: kramdown
kramdown:
  input: GFM

# Configuración de posts
permalink: /:categories/:title/

site_name: "El México Bárbaro"
site_description: "Archivo cultural independiente sobre tradiciones, gastronomía e historia de México."
site_url: "https://www.elmexicobarbaro.com"
site_language: "es-MX"
